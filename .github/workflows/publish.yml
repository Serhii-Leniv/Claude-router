name: publish

# Publishes to npm when a `v*` tag is pushed — and only when that tag points at
# a commit on master whose package.json version matches. 0.3.2 and 0.3.3 were
# published by hand from a side branch, so npm carried code that master did not;
# this workflow is the guard against a repeat: no side-branch tag can publish,
# and the provenance attestation ties every tarball to the exact commit.
#
# Requires npm trusted publishing (OIDC) to be configured for this package →
# repository/workflow pair on npmjs.com. No NPM_TOKEN secret is used.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5; Node 22's bundled npm is older.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test

      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package.json $VERSION"; exit 1
          fi

      - name: Tag must be on master
        run: |
          git fetch origin master --depth=200
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "$GITHUB_SHA is not reachable from origin/master — refusing to publish from a side branch"; exit 1
          fi

      - name: Tarball must match the previous release's shape
        run: npm pack --dry-run 2>&1 | tail -40

      - run: npm publish --provenance --access public

      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
