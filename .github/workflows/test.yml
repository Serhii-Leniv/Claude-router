name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a push run on master —
  # doing so would leave a master commit with an incomplete status check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast first signal: a single typecheck/build on Linux reports in well under
  # a minute while the full OS × Node matrix is still spinning up.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Coverage on one cell only; a report, not a gate. Node's built-in coverage
  # keeps the dev dependency list at two packages.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage 2>&1 | tee coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
